name: Python checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Репозитории сервисов, где пока только docs/, не должны получать красный CI.
      - name: Check project files
        id: project
        run: |
          if [ -f pyproject.toml ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::pyproject.toml нет: Python-кода пока нет, проверки пропущены"
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.project.outputs.python == 'true'
        with:
          python-version: '3.12'
          enable-cache: true
      - if: steps.project.outputs.python == 'true'
        run: uv sync --all-extras
      - if: steps.project.outputs.python == 'true'
        run: uv pip install --python .venv/bin/python ruff mypy
      - if: steps.project.outputs.python == 'true'
        run: uv run --no-sync ruff check . --ignore B008
      - if: steps.project.outputs.python == 'true'
        run: uv run --no-sync mypy .
      - if: steps.project.outputs.python == 'true'
        run: uv run --no-sync pytest
